name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/sync-version.mjs --check
      - run: node --test scripts/sync-version.test.mjs
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

  native:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Select stable Rust
        run: rustup update stable --no-self-update
      - run: rustup default stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: checks-${{ matrix.os }}
          cache-bin: false
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: npm ci
      # Tauri's generated context embeds the frontend production assets.
      - run: npm run build
      - name: Check Rust targets
        working-directory: src-tauri
        run: cargo check --locked --all-targets
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked --all-targets
      - name: Install loopback protocol fixtures
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/better-ftp-tests"
          "$RUNNER_TEMP/better-ftp-tests/bin/pip" install -r src-tauri/tests/requirements.txt
      - name: Run FTP, FTPS and SFTP integration tests
        if: runner.os == 'Linux'
        working-directory: src-tauri
        env:
          BFTP_TEST_PYTHON: ${{ runner.temp }}/better-ftp-tests/bin/python
        run: cargo test --locked --lib -- --include-ignored
