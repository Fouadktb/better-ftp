[package]
name = "better-ftp"
version = "0.1.0-alpha.2"
description = "A modern desktop FTP client"
license = "MIT"
repository = "https://github.com/Fouadktb/better-ftp"
authors = ["Better FTP contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "better_ftp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
suppaftp = { version = "=12.0.0", features = ["native-tls", "no-log"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
tempfile = "3"
ssh2 = { version = "=0.9.7", features = ["vendored-openssl", "openssl-on-win32"] }
base64 = "0.22"
sha2 = "0.10"
fs2 = "0.4"

[dev-dependencies]
serde_json = "1"
